      #     rm -rf /share/Dockerpython/WebPj/NxRebuild/wwwroot/*
      #     cp -r /share/Dockerpython/WebPj/NxR_source/output/wwwroot/* \
      #           /share/Dockerpython/WebPj/NxRebuild/wwwroot/
      #     cp -r ./output/wwwroot/* /deploy/
